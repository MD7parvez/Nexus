services:
  - type: web
    name: nexus
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    buildCommand: npm install && npm run build
    startCommand: npm run start -- --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_APP_MODE
        value: supabase
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      - key: SOCIAL_X_API_KEY
        sync: false
      - key: SOCIAL_LINKEDIN_CLIENT_ID
        sync: false
      - key: SOCIAL_LINKEDIN_CLIENT_SECRET
        sync: false
      - key: SOCIAL_FACEBOOK_PAGE_TOKEN
        sync: false
